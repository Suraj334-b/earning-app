name: Build APK
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to build (user or admin)"
        type: choice
        options: [user, admin]
        default: user

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find app folder
        id: find
        run: |
          APP="${{ inputs.app }}"
          F=$(grep -rl --include=pubspec.yaml -x -e "name: $APP" . | head -1 || true)
          if [ -z "$F" ]; then
            echo "Could not find a pubspec.yaml with 'name: $APP'. Project files found:"
            find . -name pubspec.yaml -not -path "./.git/*"
            exit 1
          fi
          echo "App folder: $(dirname "$F")"
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # FIXED signing key, so the SHA-1 is the same for every build and for both apps:
      #   SHA-1 = 1B:D8:4E:29:DD:52:CA:0B:1A:4D:3D:57:2D:DF:03:F9:60:E2:35:4B
      # (debug-level key for sideloaded APKs. For Play Store use your own key. Keep this repo private.)
      # A DEBUG_KEYSTORE secret, if you add one, overrides this key.
      - name: Restore signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ~/.android/debug.keystore
          else
            echo "" | base64 -d > ~/.android/debug.keystore
          fi
      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          flutter pub get
          flutter build apk --release
      - name: Show APK signing SHA-1 (must match Google Cloud)
        run: |
          APK="${{ steps.find.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -1)
          echo "### ${{ inputs.app }} app signing SHA-1" >> "$GITHUB_STEP_SUMMARY"
          "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-1" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-apk
          path: ${{ steps.find.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
